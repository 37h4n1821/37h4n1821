<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 36" width="100%" height="36">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="75%" stop-color="#00f5d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0072ff" stop-opacity="0" />
    </radialGradient>
    <filter id="divGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.3); opacity: 1; }
      }
      .node-pulse {
        transform-origin: 500px 18px;
        animation: pulseNode 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Subtle Beam -->
  <line x1="50" y1="18" x2="950" y2="18" stroke="url(#dividerGrad)" stroke-width="2" filter="url(#divGlow)" />
  <line x1="200" y1="18" x2="800" y2="18" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8" />

  <!-- Side Tech Nodes -->
  <circle cx="180" cy="18" r="3" fill="#00f2fe" filter="url(#divGlow)" />
  <circle cx="820" cy="18" r="3" fill="#00f5d4" filter="url(#divGlow)" />
  <rect x="170" y="14" width="20" height="8" rx="4" fill="none" stroke="#00f2fe" stroke-width="0.8" />
  <rect x="810" y="14" width="20" height="8" rx="4" fill="none" stroke="#00f5d4" stroke-width="0.8" />

  <!-- Center Arc Reactor Micro Core -->
  <circle cx="500" cy="18" r="14" fill="#071936" stroke="#00f2fe" stroke-width="1.5" />
  <circle cx="500" cy="18" r="10" fill="none" stroke="#ffb703" stroke-width="1" stroke-dasharray="3,2" />
  <circle cx="500" cy="18" r="5" fill="url(#nodeGlow)" class="node-pulse" />
  <polygon points="500,8 508,18 500,28 492,18" fill="none" stroke="#00f2fe" stroke-width="1" />
</svg>